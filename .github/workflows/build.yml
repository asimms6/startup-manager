name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build StartupManager.csproj -c Release --nologo
      - name: Test .NET backend
        run: dotnet test tests/StartupManager.Tests/StartupManager.Tests.csproj -c Release --nologo
      - name: Install installer compiler
        run: choco install innosetup --version=6.7.3 --yes --no-progress
      - name: Package Windows x64
        shell: powershell
        run: ./Build.ps1 -Package
      - name: Test installer lifecycle
        shell: pwsh
        run: ./tests/Installer.Tests.ps1 -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - uses: actions/upload-artifact@v7
        with:
          name: StartupManager-Windows-x64
          path: release/StartupManager-Setup.exe
          if-no-files-found: error
          compression-level: 0
