name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build StartupManager.csproj -c Release --nologo
      - name: Test .NET backend
        run: dotnet test tests/StartupManager.Tests/StartupManager.Tests.csproj -c Release --nologo
      - name: Test UI and resizing
        run: dotnet run --project tests/UI.Smoke -c Release --nologo
      - name: Install installer compiler
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') {
            throw 'Installer compiler signature verification failed.'
          }
          $compilerDirectory = Join-Path $env:RUNNER_TEMP 'Inno Setup 6'
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', ('/DIR="' + $compilerDirectory + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer compiler setup failed.' }
          "INNO_COMPILER=$compilerDirectory\ISCC.exe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package Windows x64
        shell: powershell
        run: ./Build.ps1 -Package -InnoCompiler $env:INNO_COMPILER
      - name: Test installer lifecycle
        shell: pwsh
        run: ./tests/Installer.Tests.ps1 -InnoCompiler $env:INNO_COMPILER
      - uses: actions/upload-artifact@v7
        with:
          name: StartupManager-Windows-x64
          path: release/StartupManager-Setup.exe
          if-no-files-found: error
          compression-level: 0
